[package]
name = "nbcore"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nextboard business core: store/clip/translate/ocr, exposed to the Qt host via a JSON-facade FFI"

[lib]
name = "nbcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
blake3.workspace = true
chrono.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# error-code 需 std feature 才实现 std::error::Error(clipboard-plus 原由 tauri 传递启用)
clipboard-win = { version = "5.4", features = ["std"] }
xcap = "0.9"
base64 = "0.22"
zip = { version = "=8.0.0", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3", default-features = false, features = ["socks-proxy", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_DataExchange",
  "Win32_Networking_WinHttp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }
