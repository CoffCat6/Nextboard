[package]
name = "nbcore"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nextboard business core: store/clip/translate/ocr, exposed to the Qt host via a JSON-facade FFI"

[lib]
name = "nbcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
blake3.workspace = true
chrono.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# 二维码解码(纯 Rust,quirc 检测算法的移植):无模型、无 native 依赖;
# image feature 只为 GrayImage 互转(与上面 image 0.25 同源)。
rqrr = { version = "0.7", features = ["image"] }
# error-code 需 std feature 才实现 std::error::Error(clipboard-plus 原由 tauri 传递启用)
xcap = "0.9"
base64 = "0.22"
zip = { version = "=8.0.0", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3", default-features = false, features = ["socks-proxy", "native-tls"] }

# ---- OCR 引擎(RapidOCR)的依赖 ----
# 引擎实现已**内化**为 src/ocr/rapid/(派生自 rapid-ocr-rs v0.7.0, Apache-2.0;
# 见 docs/11-rapidocr-rewrite-design.md)。以下为其直接依赖,已按需裁剪。
#
# ONNX Runtime 绑定:load-dynamic + api-28,以便显式指定 DLL 路径(不依赖 PATH)。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "load-dynamic", "api-28"] }
ndarray = "0.17"
rayon = "1.10"
geo-clipper = "0.9.0"
geo-types = "0.7"
nalgebra = "0.33"
unicode-bidi = "0.3"
num_cpus = "1.16"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
# 剪贴板 Win32 直连(M0a 起按平台门控;非 Windows 由 clip.rs 的桩承担,M1 接入 arboard)
clipboard-win = { version = "5.4", features = ["std"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_Networking_WinHttp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }

# ---- 非 Windows 平台(M1/R1)----
# 剪贴板跨平台读写:arboard(1Password 维护)。后端选择自动:X11(x11rb,纯协议
# 无动态库)优先 / Wayland data-control 次之;image-data 提供 PNG 编解码。
# 监听:轮询通道(300ms,clip.rs monitor_thread)——XFixes 事件通道随 M3 接入
# (docs/29 §12.1:事件优先、轮询兜底)。
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3", default-features = false, features = [
  "image-data",
  "wayland-data-control",
] }


[features]
# OCR 引擎(rapid/)派生自 rapid-ocr-rs,其源码里用 cfg(feature = "...") 标记
# 可选能力。本项目**固定不启用**以下特性,但源码中的 cfg 判断仍需被 rustc 认知,
# 否则会报 "unexpected cfg condition value" 警告。故在此声明为空特性。
# ⚠️ 这些特性本意为"关闭",不要误开:
opencv-backend = []      # 我们走纯 Rust 视觉后端(vision/image_backend.rs)
model-download = []      # 本项目全离线,模型路径显式传入
config-yaml = []         # 不读 YAML 配置
remote-input = []        # 不从 URL 拉图
turbojpeg-decode = []    # 不用 libjpeg-turbo 解码
image-io = []            # 不在此层做图片文件解码(由调用方给 RGBA)
cuda-provider = []
directml-provider = []
cann-provider = []

[dev-dependencies]
# 仅测试用:生成二维码样本做解码 round-trip(生产依赖零增加)
qrcode = "0.14"
